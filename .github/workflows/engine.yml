name: Engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check types
        run: npm run check

      - name: Check client JavaScript
        run: npm run check:client

      - name: Run game-engine tests
        run: npm test

      - name: Smoke test playable server
        shell: bash
        run: |
          npm run build
          npm run dev:server > /tmp/hustleverse-dev.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ | grep -q "HUSTLEVERSE"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/dist/src/game/index.js | grep -q "applyCommand"
